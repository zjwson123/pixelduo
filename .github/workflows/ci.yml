name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. PR-controlled code runs in these jobs (npm ci postinstall
# scripts, next build, and the Playwright e2e suite), so the job token must not
# be able to write to the repository; without this block it carries whatever the
# repository default is. Read-only is all checkout/build/test need.
permissions:
  contents: read

jobs:
  # Deployment configuration, checked statically. The bug class this guards
  # against — a variable documented in .env.example, read by the code, and
  # forwarded by no compose anchor, so it never reaches a container — produced a
  # real finding in every security pass for months, because verifying it by hand
  # means reading four files side by side. scripts/check-config.ts does that, and
  # it also renders each compose file through `docker compose config`, which is
  # the only way to see what a container actually receives once anchors, aliases
  # and `:?` interpolation have been applied. The runner has docker, so no
  # services are needed here.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The one class of finding a source-only audit cannot see: an advisory
      # that appears WITHOUT a commit, in code already shipped. Both of the last
      # two were found by hand in the daily pass — nodemailer 10.0.1
      # (GHSA-6vj9-mwq6-2f5v, the SNI/`servername` reuse) and next 16.3.4
      # (GHSA-vcvr-r3jv-pc5j, RCE in the Node.js `next/og` renderer, fixed in
      # 16.3.6) — and neither had a gate that would have caught it.
      #
      # `--omit=dev` is the point, not a detail: the runtime tree is what a
      # deploy ships and what an attacker can reach, and it is CLEAN today,
      # while the dev-only vitest/vite/esbuild/prisma advisories would fail this
      # job forever for code that never runs in production. `--audit-level=high`
      # keeps moderate noise out of the gate; the daily pass reports those.
      - name: Runtime dependencies carry no high or critical advisory
        run: |
          # The registry's audit endpoint is occasionally unreachable, and npm
          # exits non-zero for that too — indistinguishable from a real finding
          # unless the output is read. Retry only that case, and never report a
          # clean tree the endpoint never actually confirmed.
          for attempt in 1 2 3; do
            if out=$(npm audit --omit=dev --audit-level=high 2>&1); then
              echo "$out"; exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qi "audit endpoint returned an error"; then
              echo "[audit] registry audit endpoint unavailable (attempt $attempt/3) — retrying"
              sleep 5
            else
              exit 1
            fi
          done
          echo "[audit] the registry audit endpoint stayed unavailable — refusing to report a runtime tree it never checked"
          exit 1
      - run: npx tsx scripts/check-config.ts

  test-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixelduo
          POSTGRES_PASSWORD: pixelduo
          POSTGRES_DB: pixelduo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pixelduo -d pixelduo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pixelduo:pixelduo@localhost:5432/pixelduo_test
      NEXTAUTH_SECRET: 5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650
      NEXTAUTH_URL: http://localhost:3100
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pixelduo:pixelduo@localhost:5432/pixelduo
      NEXTAUTH_SECRET: 5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      # Plant a .env and a local SQLite database BEFORE the build, so the
      # assertion below can actually fail. The standalone artifact is what gets
      # deployed (the web image ships it, and a host deploy ships it verbatim),
      # and `next build` copies the build host's .env — NEXTAUTH_SECRET,
      # DATABASE_URL, the S3 keys — into it unconditionally, while the tracing
      # step copies the whole prisma/ directory including prisma/dev.db. The
      # postbuild prune (scripts/prune-standalone.mjs) is what removes both.
      #
      # Without planting, a checkout has no .env at all (only .env.example is
      # tracked) and no dev.db, so `find` could not match anything however
      # broken the prune became: the step proved nothing in precisely the
      # pipeline it exists to guard. The planted values are dummies and are
      # never real secrets.
      - name: Build (with plantable leaks in the tree)
        run: |
          set -o pipefail
          printf 'NEXTAUTH_SECRET=ci-planted-not-a-real-secret\nDATABASE_URL=postgresql://planted:planted@127.0.0.1:5432/planted\n' > .env
          mkdir -p prisma
          printf 'SQLite format 3\000ci-planted' > prisma/dev.db
          # tee, not a bare pipe: the assertion below reads the PRUNE's own
          # report out of this log to prove the plant reached the tree (pass 33).
          npm run build 2>&1 | tee /tmp/pd-build.log
      - name: Assert the standalone artifact carries no dotenv files or local databases
        run: |
          # No -maxdepth: the prune (scripts/prune-standalone.mjs) walks the whole
          # tree, so a depth limit here made the assertion blind to a leak the
          # prune DOES reach — a partial-depth prune regression would have
          # shipped with this step green (pass 32).
          found=$(find .next/standalone \( -name '.env*' -o -name '*.db' -o -name '*.db-journal' \) -not -path '*/node_modules/*')
          if [ -n "$found" ]; then
            echo "standalone artifact carries build-host-only files:"; echo "$found"; exit 1
          fi
          # The plant must have REACHED the standalone tree before the prune
          # removed it, or this step is the vacuous version of itself again.
          # `grep -q … .env` (what stood here) proved only that the plant exists
          # in the checkout — the working directory, which nothing asserts
          # anything about; the moment a Next version stops copying .env /
          # prisma/*.db into .next/standalone, `found` is empty because there
          # was never anything to find and this gate passes forever (pass 33).
          # The prune's own log line is the evidence that the plant got that
          # far: it names every file it deleted, so require it to name both
          # plants. That line is also the only proof the prune ran at all.
          prune_line=$(grep -m1 '\[prune-standalone\]' /tmp/pd-build.log || true)
          case "$prune_line" in
            *"removed "*)
              ;;
            *)
              echo "the prune reported no removals ($prune_line) — the planted .env and prisma/dev.db never reached .next/standalone, so the assertion above proved nothing"
              exit 1
              ;;
          esac
          printf '%s' "$prune_line" | grep -q 'standalone/\.env' || {
            echo "the prune's report does not name the planted .env — the plant never reached the standalone tree:"; echo "$prune_line"; exit 1; }
          printf '%s' "$prune_line" | grep -q 'dev\.db' || {
            echo "the prune's report does not name the planted prisma/dev.db — the plant never reached the standalone tree:"; echo "$prune_line"; exit 1; }
      - name: Assert the artifact's Prisma client cannot load a dotenv file (pass 38)
        # The prune deletes .env from the tree, but the tree's generated Prisma
        # client also READ one: its config resolved ../../../.env against its own
        # directory, so a dotenv restored beside the artifact (a pre-prune
        # backup, an rsync of a tree built without postbuild, a kept dev file)
        # loaded into every process that imports the client — the app and the
        # boot gates included — while docs/deploy.md said such a file
        # configures nothing. scripts/prune-standalone.mjs now rewrites those
        # paths to null, and this asserts the shipped artifact really carries
        # the rewrite: drop the rewrite and this step goes red, because a
        # regression here is invisible in every runtime check (the app boots
        # fine either way).
        run: |
          client=.next/standalone/node_modules/.prisma/client/index.js
          test -e "$client" || { echo "no Prisma client in the standalone tree — the app cannot run from this artifact"; exit 1; }
          grep -q '"schemaEnvPath": null' "$client" || { echo "the artifact's Prisma client still resolves a schema env path — a .env beside the tree would be live configuration:"; grep -o '"relativeEnvPaths"[^}]*}' "$client"; exit 1; }
          grep -q '"rootEnvPath": null' "$client" || { echo "the artifact's Prisma client still resolves a root env path"; exit 1; }
          grep -q "__NEXT_PROCESSED_ENV" .next/standalone/server.js || { echo "the artifact's server.js does not neutralise Next's runtime dotenv loading"; exit 1; }

  # Every image build of this repository was broken for three weeks — npm ci
  # cannot install this lockfile without .npmrc, and no Dockerfile stage copied
  # it — and nothing noticed, because no job ever built the image: the host
  # workflows install with .npmrc sitting right there, and `docker compose up`
  # without `--build` happily reuses a month-old `latest`. Building the deps
  # stage catches the whole class (the lockfile, the base image, the registry, and
  # the COPY set the install depends on) in about a minute, in parallel with the
  # other jobs.
  #
  # Pass 27: the deps stage alone was not enough. It is the two RUNTIME stages
  # that deploy — the web stage's copy+prune and the worker stage's context
  # prune — and neither was ever built by any job, so a regression in exactly
  # those instructions (one did land: `cp -a SRC DST` nesting public/ and
  # prisma/ into themselves) shipped with five green jobs. Both stages are built
  # here now, and the web image is asserted on: the prune's exclusions hold and
  # the merged, non-nested directory shape is what the image actually contains.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixelduo
          POSTGRES_PASSWORD: pixelduo
          POSTGRES_DB: pixelduo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pixelduo -d pixelduo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Node + npm ci are for the MIGRATE step before the boot smoke, not for
      # the image builds (those run entirely in Docker).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The worker image gates below used to be vacuous here: a fresh checkout
      # has no .env and no nested SQLite file, so the prune and the recursive
      # .env assertion had nothing to look at (pass 61). Plant both BEFORE the
      # build — .dockerignore keeps .env out of the context, so the nested .db
      # is what exercises the Dockerfile prune, while .env exercises the
      # context filter.
      - name: Plant build-host-only files for the image gates
        run: |
          mkdir -p lib
          printf 'NEXTAUTH_SECRET=ci-planted-not-a-real-secret\nDATABASE_URL=postgresql://planted:planted@127.0.0.1:5432/planted\n' > .env
          printf 'SQLite format 3\000ci-planted' > lib/ci-planted.db
      - name: Build the image's dependency stage
        run: docker build --progress=plain --target deps .
      - name: Build the deploy stages (web + worker)
        run: |
          # NEXTAUTH_URL is a REQUIRED build arg in practice: the /login
          # prerender imports next-auth/react, which builds new URL() from it,
          # so an arg-less build fails with TypeError: Invalid URL. Same value
          # the host build job uses.
          #
          # One retry per stage: the worker stage runs `npx prisma generate`,
          # which fetches the Prisma query engine from binaries.prisma.sh at
          # build time, and a transient network blip must not read as a broken
          # Dockerfile.
          build_with_retry() {
            if docker build --progress=plain "$@" .; then return 0; fi
            echo "[docker] build failed — retrying once"
            sleep 10
            docker build --progress=plain "$@" .
          }
          build_with_retry --target web -t pd-ci-web --build-arg NEXTAUTH_URL=http://localhost:3100
          build_with_retry --target worker -t pd-ci-worker
      - name: Assert the web image's artifact shape
        # The failure this guards against is silent in every other check: the
        # app still starts with a nested public/public, it just ships the bytes
        # twice and gains a second URL space. Checks are read-only `test`s.
        run: |
          docker run --rm --entrypoint sh pd-ci-web -c '
            set -e
            # Merged, not nested (the pass-25 copy form; see Dockerfile).
            test -e /app/public/templates
            test -e /app/prisma/schema.prisma
            test ! -e /app/public/public
            test ! -e /app/prisma/prisma
            # The single-layer prune really removed these from the IMAGE — and
            # they must be the entries the prune list can actually REACH (pass
            # 31). This block asserted docs/tests/e2e, which outputFileTracingExcludes
            # (next.config.mjs) keeps out of .next/standalone entirely — the web
            # stage copies only that tree, so those three `test !`s are true no
            # matter what the prune list says, while designs/, the compose
            # files, Caddyfile, README.md and tsconfig.tsbuildinfo ARE traced
            # into the tree and only the prune removes them (probed against a
            # real standalone output). A name dropped from the web prune would
            # have shipped them with this gate green.
            test ! -e /app/designs
            test ! -e /app/docker-compose.yml
            test ! -e /app/docker-compose.single.yml
            test ! -e /app/docker-compose.prod.yml
            test ! -e /app/Caddyfile
            test ! -e /app/README.md
            test ! -e /app/tsconfig.tsbuildinfo
            test ! -e /app/Dockerfile
            # The TypeScript sources (pass 32): the tracer keeps them for
            # prerender source maps, so the image shipped the backend source
            # (lib/ledger.ts names every fixed weakness and its pass), the
            # operator scripts and the dev configs. None of it is read at
            # runtime — the boot smoke below is what proves that.
            test ! -e /app/lib
            test ! -e /app/scripts
            test ! -e /app/app
            test ! -e /app/components
            test ! -e /app/proxy.ts
            test ! -e /app/instrumentation.ts
            test ! -e /app/next.config.mjs
            test ! -e /app/vitest.config.ts
            test ! -e /app/playwright.config.ts
            test ! -e /app/tsconfig.json
            test ! -e /app/prisma/seed.ts
            # Pass 34: the two glob expansions the prune list carries and no
            # assertion named. PRODUCT_OUTLINE.md is 33 KB of internal
            # monetisation notes and is traced into .next/standalone (probed);
            # only ./*.md removes it.
            #
            # .env.example is deliberately NOT asserted here (pass 37). The
            # pass-34 note claimed it was "the one dotenv name the build context
            # DOES carry, so unlike the three names below it can actually fail"
            # — true of the CONTEXT, false of this STAGE: the web stage copies
            # only .next/standalone, .next/static, public/ and prisma/, and
            # the standalone writer in Next takes requiredServerFiles.files plus
            # .env/.env.production only. It appears in ZERO trace manifests and
            # cannot reach /app, so the assertion was true no matter what the
            # prune list said (probed against the trace manifests this build
            # wrote). The worker stage carries it and still asserts it. What
            # replaces it are names genuinely traced into standalone AND named
            # by this prune — drop one from the list and the artifact ships it
            # with the gate green:
            test ! -e /app/PRODUCT_OUTLINE.md
            test ! -e /app/instrumentation-client.ts
            test ! -e /app/sentry.server.config.ts
            test ! -e /app/sentry.edge.config.ts
            test ! -e /app/vitest.setup.ts
            # ...while what actually RUNS is still there: the compiled chunks.
            test -e /app/server.js
            test -e /app/.next/server/instrumentation.js
            test -e /app/.next/server/middleware.js
            # The Prisma client dotenv hook (pass 38). The tree carries a
            # generated client whose config resolves ../../../.env against its
            # own directory, so ANY dotenv placed beside the artifact loaded
            # into every process that imports it — the app and the boot gates
            # included — while docs/deploy.md told the operator such a file
            # configures nothing. The postbuild prune rewrites those paths to
            # null; assert the IMAGE carries the rewrite, not just a log line.
            # (No apostrophes anywhere in this block: it is one single quoted
            # shell string, and a stray quote ends it early — pass 33.)
            test -e /app/node_modules/.prisma/client/index.js
            grep -q "\"schemaEnvPath\": null" /app/node_modules/.prisma/client/index.js
            # The Next runtime dotenv loader (pass 39): BaseServer calls
            # loadEnvConfig on the standalone directory, so a .env restored
            # beside the tree was still parsed at runtime even after the Prisma
            # rewrite — before the boot gates. postbuild prepends
            # __NEXT_PROCESSED_ENV to server.js, which makes @next/env skip
            # populating from files.
            grep -q "__NEXT_PROCESSED_ENV" /app/server.js
            for f in /app/.env /app/.env.local /app/.env.production /app/prisma/.env /app/prisma/.env.local /app/prisma/.env.production; do
              if [ -e "$f" ]; then echo "dotenv in image: $f"; exit 1; fi
            done
            echo "web image shape OK"
          '
      - name: Boot the web image against the services and require /api/health
        # The deploy artifact had never been BOOTED by any job (pass 32): every
        # gate asserted file shape, and the e2e job runs `next start` from the
        # repo tree — never standalone/server.js, which is what every compose
        # file deploys. A standalone tree that builds but cannot start (a
        # traced dependency silently absent, a broken server.js, a query engine
        # for the wrong platform) shipped with every job green.
        #
        # The schema must exist first: on this gate's FIRST run the app booted
        # against the empty service database, /api/health answered 503 ("The
        # table public.Job does not exist") and the gate went red — proving the
        # check runs the real query path rather than a liveness ping. host.docker.internal
        # reaches the job's service containers; the image pins its own UTC
        # session, and PAYMENT_ALLOW_MOCK=1 is what lets a production build boot
        # with an http origin (the same opt-in the e2e job uses).
        env:
          DATABASE_URL: postgresql://pixelduo:pixelduo@localhost:5432/pixelduo_test
        run: |
          npx prisma migrate deploy
          # 127.0.0.1: the same loopback pin as the e2e app below (pass 37) —
          # the smoke runs with PAYMENT_ALLOW_MOCK=1 and the published CI
          # signing secret, so it must not be reachable from the runner's
          # network. Everything that talks to it uses localhost.
          docker run -d --name pd-ci-web-smoke -p 127.0.0.1:3109:3000 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL="postgresql://pixelduo:pixelduo@host.docker.internal:5432/pixelduo_test" \
            -e REDIS_URL="redis://host.docker.internal:6379" \
            -e NEXTAUTH_SECRET="5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650" \
            -e NEXTAUTH_URL="http://localhost:3109" \
            -e PAYMENT_ALLOW_MOCK=1 \
            -e STORAGE_DRIVER=local \
            pd-ci-web
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3109/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "web image boot smoke FAILED — the standalone server never answered /api/health:"
            docker logs pd-ci-web-smoke 2>&1 | tail -30
            exit 1
          fi
          echo "web image boots standalone and answers /api/health"
      - name: Assert the worker image's artifact shape
        # The worker stage prunes the same material in one COPY+prune layer, and
        # nothing asserted it — while the Dockerfile itself calls this image the
        # one that matters most (a registry push or `docker save` carries it off
        # the host). A future reorder back to `COPY . .` + a separate `RUN rm -rf`
        # (the pass-25 regression), or a name dropped from the list, would ship
        # docs/, tests/, e2e/, the compose files and any planted .env in a
        # pullable image with every job green.
        run: |
          docker run --rm --entrypoint sh pd-ci-worker -c '
            set -e
            # What the worker actually runs from.
            test -e /app/package.json
            test -e /app/prisma/schema.prisma
            test -e /app/lib/queue.ts
            test -e /app/scripts/worker.ts
            test -x /app/node_modules/.bin/tsx
            # Pass 49: the test/report toolchain must not ride along. The
            # advisory gate measures the lockfile PRODUCTION scope
            # (npm audit --omit=dev), so the dev tree advisories were invisible
            # to it while this registry-pushed artifact carried them — vitest +
            # tinypool (2 critical, prototype pollution to RCE) and vite (8).
            # Dockerfile runtime-deps strips them; every name it removes is
            # asserted here, so a dependency that reintroduces one as a RUNTIME
            # package fails this gate instead of quietly re-bloating the image
            # with advisories no gate measures.
            test ! -e /app/node_modules/vitest
            test ! -e /app/node_modules/@vitest
            test ! -e /app/node_modules/vite
            test ! -e /app/node_modules/vite-node
            test ! -e /app/node_modules/tinypool
            test ! -e /app/node_modules/playwright
            test ! -e /app/node_modules/playwright-core
            test ! -e /app/node_modules/@playwright
            # ...while the two devDependencies this image EXECUTES must still be
            # here: tsx (worker + maintenance loop) and the Prisma CLI (migrate).
            test -e /app/node_modules/tsx
            test -x /app/node_modules/.bin/prisma
            # The single-layer prune really removed these from the IMAGE.
            test ! -e /app/docs
            test ! -e /app/tests
            test ! -e /app/e2e
            test ! -e /app/designs
            test ! -e /app/perf
            test ! -e /app/public/showcase
            test ! -e /app/Dockerfile
            test ! -e /app/docker-compose.yml
            test ! -e /app/Caddyfile
            test ! -e /app/README.md
            # The dot-entries (pass 30): in the build context, named by no prune list before,
            # and outside every assertion — ci.yml (deploy invariants + the published CI
            # secret) shipped in the worker image with the gate unable to see it.
            test ! -e /app/.github
            test ! -e /app/.npmrc
            test ! -e /app/.gitignore
            test ! -e /app/.dockerignore
            # Pass 34: the two compose files the web gate already asserts and
            # this one did not, plus TODO the same two glob members as the web
            # gate. This is the registry-pushed image; dropping a name from its
            # prune list shipped the file with every gate green.
            test ! -e /app/docker-compose.single.yml
            test ! -e /app/docker-compose.prod.yml
            test ! -e /app/PRODUCT_OUTLINE.md
            test ! -e /app/.env.example
            # The editor state a build host may carry (pass 31): gitignored, so
            # invisible to any "is it in the repo" check, and previously named by
            # neither .dockerignore nor this prune. All FIVE names the two lists
            # carry are asserted (pass 33): only .vscode/.idea were, so dropping
            # .claude/.cursor/*.swp from both lists shipped
            # .claude/settings.local.json — the file class the Dockerfile prune
            # comment describes, agent config that routinely holds tokens — in
            # the image a registry push carries off the host, with every gate
            # green. The glob is checked as a glob: an unmatched pattern stays
            # literal in sh, so the -e test simply fails for it. (No apostrophes
            # anywhere in this quoted script — the pass-33 test enforces it: one
            # apostrophe in a comment ends the enclosing single-quoted string
            # early, and the job then dies with an EOF error naming nothing.)
            test ! -e /app/.vscode
            test ! -e /app/.idea
            test ! -e /app/.claude
            test ! -e /app/.cursor
            for f in /app/*.swp; do if [ -e "$f" ]; then echo "editor swap file in image: $f"; exit 1; fi; done
            for f in /app/.env /app/.env.local /app/.env.production /app/prisma/.env /app/prisma/.env.local /app/prisma/.env.production; do
              if [ -e "$f" ]; then echo "dotenv in image: $f"; exit 1; fi
            done
            # Pass 61: the build step plants these, so the assertions below
            # have material to look at on a fresh checkout. .env is filtered by
            # .dockerignore; the nested .db exercises the Dockerfile recursive
            # prune (a slashless *.db pattern only reaches the context root).
            test ! -e /app/lib/ci-planted.db
            if find /app -path /app/node_modules -prune -o -type f \( -name "*.db" -o -name "*.db-journal" -o -name "*.sqlite" -o -name "*.sqlite3" \) -print | grep -q .; then
              find /app -path /app/node_modules -prune -o -type f \( -name "*.db" -o -name "*.db-journal" -o -name "*.sqlite" -o -name "*.sqlite3" \) -print
              echo "SQLite database in image"; exit 1
            fi
            # The recursive rule in .dockerignore is the primary control; this
            # catches any nested dotenv a future COPY/prune path re-introduces.
            if find /app -path /app/node_modules -prune -o -name ".env*" -print | grep -q .; then
              find /app -path /app/node_modules -prune -o -name ".env*" -print
              echo "nested dotenv in image"; exit 1
            fi
            # The worker regenerates its Prisma client AFTER the .env prune, so
            # it needs the pass-38 rewrite too (pass 39) — and the source/config
            # names the web stage refuses must not ride along in the image a
            # registry push carries off the host.
            test -e /app/node_modules/.prisma/client/index.js
            grep -q "\"schemaEnvPath\": null" /app/node_modules/.prisma/client/index.js
            test ! -e /app/app
            test ! -e /app/components
            test ! -e /app/next.config.mjs
            test ! -e /app/proxy.ts
            test ! -e /app/instrumentation.ts
            test ! -e /app/instrumentation-client.ts
            test ! -e /app/sentry.server.config.ts
            test ! -e /app/sentry.edge.config.ts
            test ! -e /app/vitest.config.ts
            test ! -e /app/vitest.setup.ts
            test ! -e /app/playwright.config.ts
            test ! -e /app/prisma/seed.ts
            test ! -e /app/public
            echo "worker image shape OK"
          '
      - name: Boot the worker image against the services
        # The worker image is the artifact the Dockerfile itself calls the one
        # that matters most, and until pass 33 no job had ever STARTED it: every
        # gate asserted file shape, and the e2e job's worker runs `npx tsx` from
        # the repo tree with devDependencies installed — never the pruned image,
        # whose entrypoint is exactly that command (Dockerfile CMD). A missing
        # font package, a prisma engine for the wrong platform, or a prune that
        # removed something the boot path reads ships green in the image
        # operators are told to keep old tags of. The services and the migrated
        # schema are already here from the web smoke above, so this costs one
        # container start.
        #
        # The gate is the worker's own startup line — printed only after both
        # production boot gates (mock-provider refusal, UTC session) pass — plus
        # the container still being alive at that moment, so "started then died"
        # cannot read as booted.
        run: |
          docker run -d --name pd-ci-worker-smoke \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL="postgresql://pixelduo:pixelduo@host.docker.internal:5432/pixelduo_test" \
            -e REDIS_URL="redis://host.docker.internal:6379" \
            -e NEXTAUTH_SECRET="5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650" \
            -e STORAGE_DRIVER=local \
            pd-ci-worker
          ok=""
          for i in $(seq 1 30); do
            if docker logs pd-ci-worker-smoke 2>&1 | grep -q '\[worker\] PixelDuo media worker started'; then ok=1; break; fi
            sleep 2
          done
          running="$(docker inspect -f '{{.State.Running}}' pd-ci-worker-smoke 2>/dev/null || echo false)"
          # Captured BEFORE the container goes away — reading the logs after
          # `docker rm` prints nothing, which is exactly the moment this gate
          # most needs to say why it failed.
          logs="$(docker logs pd-ci-worker-smoke 2>&1 | tail -30 || true)"
          docker rm -f pd-ci-worker-smoke >/dev/null 2>&1 || true
          if [ -z "$ok" ] || [ "$running" != "true" ]; then
            echo "worker image boot smoke FAILED — the worker never reached its startup line (running=$running):" >&2
            echo "$logs" >&2
            exit 1
          fi
          echo "worker image boots against the services and reports started"

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixelduo
          POSTGRES_PASSWORD: pixelduo
          POSTGRES_DB: pixelduo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pixelduo -d pixelduo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pixelduo:pixelduo@localhost:5432/pixelduo_test
      NEXTAUTH_SECRET: 5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650
      REDIS_URL: redis://localhost:6379
      MOCK_IMAGE_PROVIDER: "1"
      # `next start` runs a production build, so the mock payment provider
      # refuses to load without this opt-in (lib/payments/index.ts) and every
      # checkout-driven e2e fails with internal-error. Mirrors ci-local.sh.
      PAYMENT_ALLOW_MOCK: "1"
      EMAIL_VERIFY_AUTO: "1"
      MIDDLEWARE_AUTH_LIMIT: "1000"
      MIDDLEWARE_API_LIMIT: "10000"
      MIDDLEWARE_PAGE_LIMIT: "10000"
      REGISTER_RATE_LIMIT: "10000"
      # Email links are built from NEXTAUTH_URL; the specs run against the port
      # below. MAIL_DEV_DIR makes the log-only mailer write each message to disk
      # so a spec can follow the link out of it (lib/mail.ts DevMailer) —
      # without it the reset spec and the pending-verification pass have no way
      # to read their links.
      NEXTAUTH_URL: http://localhost:3100
      MAIL_DEV_DIR: /tmp/pd-mail
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run build
      - name: Install Playwright Chromium
        # The runner's apt mirror is occasionally unreachable, and it failed this
        # job twice on 2026-11-11 BEFORE any test ran ("Temporary failure
        # resolving 'azure.archive.ubuntu.com'"). The browser comes from
        # Playwright's CDN and ubuntu-latest already ships Chromium's shared
        # libraries; what `--with-deps` adds beyond that on this image is fonts,
        # which this suite never asserts (it checks text content, not glyphs).
        # Keep the faithful attempt, but fall back to the browser-only install so
        # a mirror outage cannot red the pipeline while leaving a real browser
        # failure to surface as a test failure.
        run: |
          npx playwright install --with-deps chromium || {
            echo "::warning::playwright install-deps failed (runner apt mirror?); falling back to the runner image's preinstalled libraries"
            npx playwright install chromium
          }
      - name: Start app + worker
        run: |
          # Loopback, not 0.0.0.0 (pass 37): this stack auto-verifies
          # registrations, accepts mock payments and trusts X-Forwarded-For for
          # its per-IP limiters, and `next start` binds every interface by
          # default. scripts/ci-local.sh pins 127.0.0.1 for the same reason ("no
          # TLS, no edge, XFF-trusting per-IP limiters"); a GitHub-hosted runner
          # normally has no inbound path, so this aligns the two entry points
          # rather than repairing a demonstrated exposure. Playwright, the
          # worker and every health curl here use localhost.
          npx next start -p 3100 -H 127.0.0.1 &
          npx tsx scripts/worker.ts &
          sleep 8
      - name: Wait for health
        run: |
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3100/api/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "app never became healthy"; exit 1; }
      - run: npx playwright test
      # The pending-verification flow cannot share a process with the
      # auto-verified one (EMAIL_VERIFY_AUTO is read at registration time), so
      # that spec gets a second instance of the same build on its own port. The
      # worker is shared: it polls the database, not either app.
      - name: Start app in pending-verification mode (port 3101)
        env:
          EMAIL_VERIFY_AUTO: "0"
          NEXTAUTH_URL: http://localhost:3101
        run: |
          # -H 127.0.0.1: the same loopback pin as the 3100 instance above
          # (pass 37), kept in step by pass 38 — this instance is also a
          # production build with PAYMENT_ALLOW_MOCK=1 and the published CI
          # signing secret, so `next start`'s 0.0.0.0 default would serve it to
          # the network for the job's duration. Everything that talks to it
          # (playwright, the health curls) uses localhost.
          npx next start -p 3101 -H 127.0.0.1 &
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3101/api/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "verification-mode app never became healthy"; exit 1; }
      - name: E2E (pending-verification flow)
        env:
          EMAIL_VERIFY_AUTO: "0"
          NEXTAUTH_URL: http://localhost:3101
          PW_BASE_URL: http://localhost:3101
        run: npx playwright test e2e/verify-email.spec.ts
