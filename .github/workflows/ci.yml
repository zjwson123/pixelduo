name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. PR-controlled code runs in these jobs (npm ci postinstall
# scripts, next build, and the Playwright e2e suite), so the job token must not
# be able to write to the repository; without this block it carries whatever the
# repository default is. Read-only is all checkout/build/test need.
permissions:
  contents: read

jobs:
  # Deployment configuration, checked statically. The bug class this guards
  # against — a variable documented in .env.example, read by the code, and
  # forwarded by no compose anchor, so it never reaches a container — produced a
  # real finding in every security pass for months, because verifying it by hand
  # means reading four files side by side. scripts/check-config.ts does that, and
  # it also renders each compose file through `docker compose config`, which is
  # the only way to see what a container actually receives once anchors, aliases
  # and `:?` interpolation have been applied. The runner has docker, so no
  # services are needed here.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-config.ts

  test-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixelduo
          POSTGRES_PASSWORD: pixelduo
          POSTGRES_DB: pixelduo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pixelduo -d pixelduo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pixelduo:pixelduo@localhost:5432/pixelduo_test
      NEXTAUTH_SECRET: 5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650
      NEXTAUTH_URL: http://localhost:3100
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pixelduo:pixelduo@localhost:5432/pixelduo
      NEXTAUTH_SECRET: 5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
      # The standalone artifact is what gets deployed (the web image ships it, and
      # a host deploy ships it verbatim). `next build` copies the build host's
      # .env — NEXTAUTH_SECRET, DATABASE_URL, the S3 keys — into it
      # unconditionally, so the postbuild prune (scripts/prune-standalone.mjs)
      # has to run and has to work. The failure mode is silent and the artifact
      # leaves the machine, so assert it here.
      - name: Assert the standalone artifact carries no dotenv files
        run: |
          found=$(find .next/standalone -maxdepth 2 -name '.env*' -not -path '*/node_modules/*')
          if [ -n "$found" ]; then
            echo "standalone artifact carries dotenv files:"; echo "$found"; exit 1
          fi

  # Every image build of this repository was broken for three weeks — npm ci
  # cannot install this lockfile without .npmrc, and no Dockerfile stage copied
  # it — and nothing noticed, because no job ever built the image: the host
  # workflows install with .npmrc sitting right there, and `docker compose up`
  # without `--build` happily reuses a month-old `latest`. Building the deps
  # stage catches the whole class (the lockfile, the base image, the registry, and
  # the COPY set the install depends on) in about a minute, in parallel with the
  # other jobs.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image's dependency stage
        run: docker build --progress=plain --target deps .

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixelduo
          POSTGRES_PASSWORD: pixelduo
          POSTGRES_DB: pixelduo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pixelduo -d pixelduo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pixelduo:pixelduo@localhost:5432/pixelduo_test
      NEXTAUTH_SECRET: 5c1f8e2a94b7d03f6ae4c81d2795bf30e6a1c47d8b92f650
      REDIS_URL: redis://localhost:6379
      MOCK_IMAGE_PROVIDER: "1"
      # `next start` runs a production build, so the mock payment provider
      # refuses to load without this opt-in (lib/payments/index.ts) and every
      # checkout-driven e2e fails with internal-error. Mirrors ci-local.sh.
      PAYMENT_ALLOW_MOCK: "1"
      EMAIL_VERIFY_AUTO: "1"
      MIDDLEWARE_AUTH_LIMIT: "1000"
      MIDDLEWARE_API_LIMIT: "10000"
      REGISTER_RATE_LIMIT: "10000"
      # Email links are built from NEXTAUTH_URL; the specs run against the port
      # below. MAIL_DEV_DIR makes the log-only mailer write each message to disk
      # so a spec can follow the link out of it (lib/mail.ts DevMailer) —
      # without it the reset spec and the pending-verification pass have no way
      # to read their links.
      NEXTAUTH_URL: http://localhost:3100
      MAIL_DEV_DIR: /tmp/pd-mail
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start app + worker
        run: |
          npx next start -p 3100 -H 0.0.0.0 &
          npx tsx scripts/worker.ts &
          sleep 8
      - name: Wait for health
        run: |
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3100/api/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "app never became healthy"; exit 1; }
      - run: npx playwright test
      # The pending-verification flow cannot share a process with the
      # auto-verified one (EMAIL_VERIFY_AUTO is read at registration time), so
      # that spec gets a second instance of the same build on its own port. The
      # worker is shared: it polls the database, not either app.
      - name: Start app in pending-verification mode (port 3101)
        env:
          EMAIL_VERIFY_AUTO: "0"
          NEXTAUTH_URL: http://localhost:3101
        run: |
          npx next start -p 3101 &
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3101/api/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "verification-mode app never became healthy"; exit 1; }
      - name: E2E (pending-verification flow)
        env:
          EMAIL_VERIFY_AUTO: "0"
          NEXTAUTH_URL: http://localhost:3101
          PW_BASE_URL: http://localhost:3101
        run: npx playwright test e2e/verify-email.spec.ts
