# App containers run as `node` and listen on an unprivileged port, so none of
# them needs privilege escalation or a Linux capability. Dropping ALL caps and
# setting no-new-privileges blocks the post-compromise path from a dependency /
# libvips bug to CAP_NET_RAW spoofing on the compose network (pass 59). Caddy
# is excluded from cap_drop because binding 80/443 needs NET_BIND_SERVICE.
x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *app-hardening
    restart: "no"
    # Pinned like web/worker/rollover below (pass 34; pass 31 pinned the two
    # production files only). Without it compose derives <project>-migrate, so
    # the documented `docker compose build migrate web worker rollover` built a
    # fourth image no `up` ever starts, and the tag-swap rollback story
    # ("IMAGE_WORKER=... covers all four services") was not true of this file.
    image: ${IMAGE_WORKER:-image-gen-worker:latest}
    build:
      context: .
      target: worker
    command: npx prisma migrate deploy
    environment: &appenv
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixelduo}:${POSTGRES_PASSWORD:-pixelduo}@db:5432/${POSTGRES_DB:-pixelduo}
      # Next.js standalone binds to $HOSTNAME by default; Docker injects the
      # container ID, which makes in-container probes (healthcheck) fail.
      # Pin it to 0.0.0.0 so the server listens on all interfaces.
      HOSTNAME: 0.0.0.0
      # Quoted: the ": " inside the message made this line invalid YAML, so the
      # documented local stack could not start at all (`docker compose up` and
      # `docker compose config` both died at parse time).
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET (generate with: openssl rand -base64 32)}"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # The client DSN is consumed at BUILD time (see the web service's build
      # args below); it is named here as well so one .env line covers both
      # sides and `docker compose config` shows where it goes.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # This file is the LOCAL stack (prod is docker-compose.prod.yml): it
      # defaults to an http NEXTAUTH_URL and a mock payment provider, both of
      # which the production boot assertions refuse. These two flags are the
      # documented escape hatches those assertions name — without them the
      # containers exited(1) at boot and the local full-stack path was dead.
      PAYMENT_ALLOW_MOCK: ${PAYMENT_ALLOW_MOCK:-1}
      MAIL_DEV_MODE: ${MAIL_DEV_MODE:-1}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Where user feedback goes. Compose forwards only the variables it names
      # here, so leaving this out of the anchor kept FEEDBACK_TO unreachable in
      # containers: the documented flow (set SMTP_URL, done) then mailed every
      # reporter's message to the address baked into lib/mail.ts instead of the
      # operator's inbox. Production refuses to send feedback at all while this
      # is unset — set it.
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
      FEEDBACK_WEBHOOK_KIND: ${FEEDBACK_WEBHOOK_KIND:-feishu}
      EMAIL_VERIFY_AUTO: ${EMAIL_VERIFY_AUTO:-0}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-}
      # Pinned, NOT overridable from .env — for the same reason S3_ENDPOINT below
      # is. `.env.example` ships STORAGE_DRIVER=local for a host-run `next start`
      # (where the app and the files share a filesystem) and this anchor used to
      # inherit it: in containers "local" means /app/data/files INSIDE each
      # container's own writable layer, with no volume mounted for it. The worker
      # wrote generated images into its own copy, /api/files read the web
      # container's empty one and 404'd every delivered image, `compose down`
      # destroyed them, and edits/videos degraded to text-to-image runs because a
      # missing reference read as "no reference" — all while /api/health reported
      # storage "up", since LocalStorage.health() probes only its own directory.
      # The bucket is right here in this stack.
      STORAGE_DRIVER: s3
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Pinned OFF here, and not overridable from .env — see S3_ENDPOINT below,
      # pinned for the same reason. `.env.example` ships IMAGE_MODERATION=1 for
      # PRODUCTION, but this stack has no vision credential of its own: the only
      # source is the ~/.cc-proxy/config.json mount, which is a developer
      # convenience on one machine and an empty DIRECTORY everywhere else (Docker
      # creates the host path on first use; loadCcProxyConfig swallows the
      # EISDIR). Inheriting 1 from a plain `cp .env.example .env` made the
      # worker's fail-closed boot gate exit(1), and with no restart policy it
      # stayed down — so the stack looked up, /api/health was green, and nothing
      # could generate. Want moderation locally? Set this to "1" and point
      # VISION_MODERATION_* at a public gateway.
      IMAGE_MODERATION: "0"
      # Default must match lib/keys.ts and .env.example (gpt-5.6-luna): every
      # anchor used to pin gpt-5.4, a model the gateway does not serve, so a
      # containerised audit failed on every image — fail-closed (jobs refund) but
      # it invites "fixing" it by turning IMAGE_MODERATION off.
      VISION_MODERATION_MODEL: ${VISION_MODERATION_MODEL:-gpt-5.6-luna}
      # The endpoint and key halves that make that model usable. Both production
      # anchors name them; this one did not, so an operator configuring vision
      # moderation here — the documented .env.example pair — had it dropped in
      # the container, and getVisionConfig() then found no env override at all
      # and silently fell back to the cc-proxy modelverse gateway: a different
      # endpoint on a different credential than the one just configured.
      VISION_MODERATION_BASE_URL: ${VISION_MODERATION_BASE_URL:-}
      VISION_MODERATION_API_KEY: ${VISION_MODERATION_API_KEY:-}
      # Knobs the code reads and .env.example documents which no anchor named —
      # so in a container they were unreachable, because the anchor is the only
      # path an env var has into one. IMAGE_NSFW_ENDPOINT is the consequential
      # one (an operator who sets it and turns IMAGE_MODERATION off got neither
      # detector); the rest simply fell back to their defaults.
      IMAGE_NSFW_ENDPOINT: ${IMAGE_NSFW_ENDPOINT:-}
      WATERMARK_TEXT: ${WATERMARK_TEXT:-}
      CHECKIN_TIMEZONE: ${CHECKIN_TIMEZONE:-}
      FEEDBACK_NOTIFY_LIMIT: ${FEEDBACK_NOTIFY_LIMIT:-}
      AUTH_MAIL_HOURLY_LIMIT: ${AUTH_MAIL_HOURLY_LIMIT:-}
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      TRUST_X_REAL_IP: ${TRUST_X_REAL_IP:-0}
      # Social sign-in (all four, or lib/auth.ts registers nothing) and the
      # per-route limit knobs — none of these was named by any anchor, so a
      # container deployment could neither enable OAuth nor tighten a limit.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MIDDLEWARE_AUTH_LIMIT: ${MIDDLEWARE_AUTH_LIMIT:-}
      MIDDLEWARE_API_LIMIT: ${MIDDLEWARE_API_LIMIT:-}
      MIDDLEWARE_PAGE_LIMIT: ${MIDDLEWARE_PAGE_LIMIT:-}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-}
      OAUTH_CALLBACK_RATE_LIMIT: ${OAUTH_CALLBACK_RATE_LIMIT:-}
      OUTBOUND_TIMEOUT_MS: ${OUTBOUND_TIMEOUT_MS:-}
      # The endpoint half of the assistant's credential pair: lib/keys.ts
      # resolves key and endpoint together and ignores a half-set pair, so this
      # must travel with DEEPSEEK_API_KEY. The dev stack normally leaves both
      # empty and reads the mounted cc-proxy config instead — and naming only
      # this half meant that setting the pair in .env (the documented way)
      # created exactly the half-set state the atomic resolver refuses: the key
      # was absent, so the pair resolved to null AND the cc-proxy fallback was
      # skipped, and the assistant quietly used its offline expander.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      # Pinned to the in-network name ON PURPOSE and not overridable: this single
      # variable is both the S3 client's endpoint and the host that gets
      # PRESIGNED into handed-out URLs, and a value an .env override could reach
      # (http://localhost:9000 for a host-run app) resolves to the container
      # itself. The production composes take ${S3_ENDPOINT} because there the
      # bucket is off-network and one public address serves both roles.
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-pixelduo}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pixelduo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pixelduo-secret}
      S3_FORCE_PATH_STYLE: "true"
      # The vendor's own spelling of the Aliyun/DashScope credential. Normally
      # supplied by the mounted cc-proxy config here, but an operator who sets it
      # in .env has it dropped unless the anchor names it (lib/keys.ts accepts
      # either name; the production anchors name only ALIYUN_API_KEY, which is
      # fixed there too).
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # The three image/video provider credentials. README tells the operator to
      # inject exactly these ("the containers cannot read the host's
      # ~/.cc-proxy/config.json") and this anchor named none of them, so the
      # documented remedy left the container with no image-provider credential
      # and every job failed in the worker. Both production anchors have always
      # named them; only this one dropped them.
      MODELVERSE_IMAGE_API_KEY: ${MODELVERSE_IMAGE_API_KEY:-}
      ARK_IMAGE_API_KEY: ${ARK_IMAGE_API_KEY:-}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-hardening
    restart: unless-stopped

    # Pinned, with the same defaults docker-compose.prod.yml consumes. Without
    # it Compose derives the name from the PROJECT DIRECTORY ("pixelduo-web" for
    # the clone path the deploy docs use, "image-gen-web" in this tree), so the
    # images this file builds were not the images prod.yml was then asked to
    # start — and a rollback that tags a name by hand tagged nothing.
    image: ${IMAGE_WEB:-image-gen-web:latest}
    build:
      context: .
      target: web
      args:
        # Baked into the prerendered metadata (og:url / og:image — see the
        # Dockerfile): the `.env` value at build time, so share previews point at
        # the real origin. The Dockerfile now REFUSES an empty value (pass 53),
        # so the default here matches the runtime anchor's own default rather
        # than letting a dev `docker compose build` fail.
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        # Build-time only, like NEXTAUTH_URL: instrumentation-client.ts is compiled
        # into the client bundle, so without a build arg these had no path into an
        # image at all and every containerised deployment ran with client-side
        # reporting (and source maps) silently off.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}
        # (No SENTRY_AUTH_TOKEN here: a build ARG is not a secret — it is
        # recorded in the image history and in every `docker save` tarball, and
        # this one bought nothing because next.config.mjs gates the Sentry
        # wrapper on SENTRY_DSN, which no build in this repository sets. See
        # the Dockerfile's note; symbolication needs a BuildKit secret.)
    ports:
      # Loopback-only. With no edge in front, publishing on 0.0.0.0 exposes an
      # unencrypted origin AND makes every per-IP limiter (auth, register,
      # password reset, 2FA) key on a client-chosen X-Forwarded-For: anyone who
      # can reach the port sends a fresh header per request and gets a fresh
      # bucket. The stateful services below are pinned for the same reason.
      - "127.0.0.1:3000:3000"
    environment: *appenv
    volumes:
      # Local dev: let the container read real provider keys from the host
      # cc-proxy config. Production: inject MODELVERSE_IMAGE_API_KEY /
      # ARK_IMAGE_API_KEY / DEEPSEEK_API_KEY via env/secrets instead.
      - ${CC_PROXY_CONFIG:-${HOME}/.cc-proxy/config.json}:/home/node/.cc-proxy/config.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # busybox wget resolves "localhost" to ::1 first (IPv6) and the server
      # listens on IPv4 0.0.0.0 only; use 127.0.0.1 explicitly.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app-hardening
    restart: unless-stopped

    image: ${IMAGE_WORKER:-image-gen-worker:latest}
    build:
      context: .
      target: worker
    command: npx tsx scripts/worker.ts
    environment:
      <<: *appenv
      MOCK_IMAGE_PROVIDER: ${MOCK_IMAGE_PROVIDER:-0}
    volumes:
      - ${CC_PROXY_CONFIG:-${HOME}/.cc-proxy/config.json}:/home/node/.cc-proxy/config.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  rollover:
    <<: *app-hardening
    restart: unless-stopped

    image: ${IMAGE_WORKER:-image-gen-worker:latest}
    build:
      context: .
      target: worker
    # Every pass is chained with && and a failure ends the container (instead of
    # `;`, which discarded each exit status and looped forever): a persistent
    # failure here — database down, a broken deploy, OOM — used to stop plan
    # downgrade, credit expiry and the expiry reminders SILENTLY, since the loop
    # never exited and no healthcheck watches this service. Now the failure is a
    # restart loop the operator can see, and `restart: unless-stopped` retries it.
    command: sh -c "while true; do npx tsx scripts/rollover.ts && npx tsx scripts/expire.ts && npx tsx scripts/remind.ts || { echo '[rollover] a maintenance pass failed — exiting for a retry'; exit 1; }; sleep 86400; done"
    environment: *appenv
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    restart: unless-stopped

    image: postgres:16-alpine
    container_name: pixelduo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixelduo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelduo}
      POSTGRES_DB: ${POSTGRES_DB:-pixelduo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pixelduo} -d $${POSTGRES_DB:-pixelduo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped

    image: redis:7-alpine
    container_name: pixelduo-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    restart: unless-stopped

    # Pinned by digest on purpose. MinIO is the object store holding every
    # generated image and `mc` is the client both DR scripts depend on; MinIO
    # ships breaking changes inside a release line, and these two were the only
    # images in the stack not pinned to a major (postgres:16-alpine,
    # redis:7-alpine, caddy:2-alpine, node:24-alpine). The digest below is the
    # one verified on 2026-09-28 — minio RELEASE.2025-09-07T16-13-09Z — so a
    # `docker compose pull` cannot move the store (or `mc mirror` semantics)
    # under a running deployment without a deliberate edit here.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: pixelduo-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-pixelduo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-pixelduo-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  init-storage:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    # No `environment:` block meant nothing set S3_ACCESS_KEY_ID inside this
    # container, so `$${S3_ACCESS_KEY_ID:-pixelduo}` fell back to the defaults
    # while the MinIO server itself is configured from ${S3_ACCESS_KEY_ID} in
    # .env. The moment an operator follows .env.example's own instruction
    # ("change these in any non-local environment"), the alias setup failed, the
    # bucket creation was swallowed by `|| true`, and the container exited 1 with
    # nothing anyone sees: the bucket never exists, every upload fails, and the
    # stack reports unhealthy with no clue why. single.yml injects
    # MINIO_ROOT_USER/PASSWORD here; this is the same thing under this file's
    # names. The credential is assembled into MC_HOST_local rather than passed
    # to `mc alias set` argv (pass 57).
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pixelduo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pixelduo-secret}
      S3_BUCKET: ${S3_BUCKET:-pixelduo}
    entrypoint: >
      /bin/sh -c "
      enc() { _s=\"$$1\"; _o=\"\"; while [ -n \"$$_s\" ]; do _c=\"$${_s%\"$${_s#?}\"}\"; _s=\"$${_s#?}\"; case \"$$_c\" in [a-zA-Z0-9._~-]) _o=\"$$_o$$_c\";; %) _o=\"$${_o}%25\";; @) _o=\"$${_o}%40\";; :) _o=\"$${_o}%3A\";; /) _o=\"$${_o}%2F\";; [?]) _o=\"$${_o}%3F\";; [#]) _o=\"$${_o}%23\";; \" \") _o=\"$${_o}%20\";; *) _o=\"$$_o$$_c\";; esac; done; printf '%s' \"$$_o\"; };
      MC_HOST_local=\"http://$$(enc \"$$S3_ACCESS_KEY_ID\"):$$(enc \"$$S3_SECRET_ACCESS_KEY\")@storage:9000\";
      export MC_HOST_local;
      mc mb -p local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'minio bucket ready'"

  backup:
    restart: unless-stopped
    # Dumps are written as the OPERATOR's uid, not root. Without this the
    # container's `umask 077` file lands in ./backups owned by root:root, and
    # the documented recovery steps — `pg_restore -d "$DATABASE_URL"
    # backups/<stamp>` on the host, or copying ./backups to object storage, both
    # in docs/deploy.md — die with "Permission denied" for the non-root operator
    # the install guide creates (§1: a sudo-capable user in the docker group).
    # During an incident that reads as a corrupt or missing backup. The loop only
    # needs write access to /backups, so nothing about it requires uid 0.
    # Docker Desktop hides this on macOS (files come out host-owned); on the
    # documented Ubuntu VPS target it is exactly the failure above.
    #
    # The OTHER half of that failure is the bind mount itself (pass 34):
    # backups/ is gitignored, so a fresh clone has no such directory and Docker
    # creates it OWNED BY ROOT on the host - uid 1000 then has r-x, pg_dump
    # cannot open its output file, and the chmod below (which fails for the same
    # reason) had its stderr discarded, so the only signal was one FAILED line
    # per day in a log nobody reads while both services stayed Up. The loops now
    # test writability first and say the reason and the remedy. docs/server-setup
    # step 4 creates and chowns the directory; this is the belt to that.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-pixelduo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pixelduo}
      # Same variable that builds DATABASE_URL (see the db service above and
      # .env.example's "change them for any shared environment"): a renamed
      # database with a literal name here stopped every nightly dump with a
      # line in `docker compose logs backup` as the only signal — no dump, no
      # healthcheck, nothing alerts. `-d "$$PGDATABASE"` is explicit so the
      # name comes from the environment, not PGDATABASE's implicit default.
      PGDATABASE: ${POSTGRES_DB:-pixelduo}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    command: >
      sh -c 'while true; do
        umask 077;
        if [ ! -w /backups ]; then echo "[backup] /backups is NOT writable by uid $$(id -u): the bind-mounted ./backups is missing or owned by another user, so no dump will ever be written. On the host: mkdir -p backups && chown $$(id -u):$$(id -g) backups" >&2; fi;
        chmod 700 /backups 2>/dev/null || true;
        # Retention is a DESTRUCTIVE setting, so a value the operator did not
        # mean must not be read as a number (pass 58). The arithmetic below
        # treated a typo ("1O") or a negative value as 0 — "keep one" — so the
        # nightly rotation deleted backups the operator had asked to keep,
        # silently, while scripts/backup.sh refuses the same value. Validation
        # runs before anything is renamed; an invalid value skips rotation
        # entirely, so the dump is still written and every previous one kept.
        ROTATE=1;
        case "$$BACKUP_KEEP" in ""|*[!0-9]*) ROTATE=0; echo "[backup] FAILED: BACKUP_KEEP must be a non-negative integer (got $$BACKUP_KEEP) — rotation is SKIPPED and every previous dump is kept" >&2;; esac;
        STAMP=$$(date +%Y%m%d-%H%M%S);
        TMP=/backups/.pixelduo-$${STAMP}.partial;
        if pg_dump -Fc -d "$$PGDATABASE" -f $$TMP; then
          mv $$TMP /backups/pixelduo-$${STAMP}.dump.gz;
          # `BACKUP_KEEP > 0 ? … + 1 : 2` rather than the bare `+ 1` (pass 37):
          # tail -n +1 prints EVERY line, so BACKUP_KEEP=0 — the natural spelling
          # of "no retention", and what a whitespace-only value collapses to —
          # deleted the dump renamed into place one line earlier and then printed
          # "written, keeping 0": zero backups, every log affirming one (probed).
          # A numeric 0 keeps the newest. A non-numeric value never reaches this
          # arithmetic: the `case` above turns ROTATE off and keeps everything
          # (pass 58 — it used to be read as 0 here).
          if [ "$$ROTATE" = 1 ]; then ls -1t /backups/pixelduo-*.dump.gz | tail -n +$$((BACKUP_KEEP > 0 ? BACKUP_KEEP + 1 : 2)) | xargs -r rm -f; fi;
          if [ "$$ROTATE" = 1 ]; then echo "[backup] $$STAMP written, keeping $$((BACKUP_KEEP > 0 ? BACKUP_KEEP : 1))"; else echo "[backup] $$STAMP written; rotation skipped because BACKUP_KEEP is invalid (every previous dump is kept)"; fi;
        else
          rm -f $$TMP;
          echo "[backup] FAILED at $$STAMP — no dump written, rotation skipped (the previous dumps are untouched)" >&2;
        fi;
        sleep 86400;
      done'

  backup-objects:
    restart: unless-stopped
    # Dumps are written as the OPERATOR's uid, not root. Without this the
    # container's `umask 077` file lands in ./backups owned by root:root, and
    # the documented recovery steps — `pg_restore -d "$DATABASE_URL"
    # backups/<stamp>` on the host, or copying ./backups to object storage, both
    # in docs/deploy.md — die with "Permission denied" for the non-root operator
    # the install guide creates (§1: a sudo-capable user in the docker group).
    # During an incident that reads as a corrupt or missing backup. The loop only
    # needs write access to /backups, so nothing about it requires uid 0.
    # Docker Desktop hides this on macOS (files come out host-owned); on the
    # documented Ubuntu VPS target it is exactly the failure above.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      storage:
        condition: service_healthy
    environment:
      BACKUP_S3_ENDPOINT: http://storage:9000
      BACKUP_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pixelduo}
      BACKUP_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pixelduo-secret}
      BACKUP_S3_BUCKET: ${S3_BUCKET:-pixelduo}
      BACKUP_KEEP: ${BACKUP_KEEP_OBJECTS:-7}
      BACKUP_TARGET_ENDPOINT: ${BACKUP_TARGET_ENDPOINT:-}
      BACKUP_TARGET_ACCESS_KEY_ID: ${BACKUP_TARGET_ACCESS_KEY_ID:-}
      BACKUP_TARGET_SECRET_ACCESS_KEY: ${BACKUP_TARGET_SECRET_ACCESS_KEY:-}
      BACKUP_TARGET_BUCKET: ${BACKUP_TARGET_BUCKET:-}
    volumes:
      - ./backups:/backups
    # `.partial` + rename, and the rotation runs ONLY on success — the same shape
    # the pg_dump loop above uses, and for the same reason.
    #
    # This loop used to run `mc alias set …; mc mirror …;` with no test of either
    # status, print "$${STAMP} mirrored" unconditionally, and rotate
    # regardless. Rotated credentials, an unreachable endpoint or a bucket
    # recreated empty therefore produced an empty/partial stamp directory that
    # counted as the newest snapshot — so that night's rotation deleted the
    # oldest COMPLETE snapshot, and the only signal was a success line. The
    # restore path in docs/deploy.md would have found nothing but the empty
    # ones. Both `mc` legs are gated now, including the off-site mirror.
    #
    # Pass 56: this loop could never succeed as written. The pinned mc image
    # has no `find`, so the non-empty gate always measured 0 (and `grep`, used
    # by the remote rotation, is absent too — the old prefixes were never
    # pruned). It also runs as ${BACKUP_UID}, whose $HOME=/ is unwritable, so
    # `mc alias set` itself failed. Home is exported inside the loop; counts
    # and the stamp filter now use mc and the shell only.
    # Credentials are assembled into MC_HOST_* INSIDE the container and never
    # passed to `mc` as argv. `mc alias set <url> <key> <secret>` puts the store
    # credential (on the single-VPS stack, MinIO's ROOT password) into the
    # process's command line, which /proc/<pid>/cmdline exposes to every local
    # account on the host while the daily job runs. MC_HOST_* is read from the
    # child environment, which only the owning uid can read. The credentials are
    # percent-encoded first so a password with @/:/#/etc. cannot alter the URL.
    command: >
      'while true; do
        enc() { _s="$$1"; _o=""; while [ -n "$$_s" ]; do _c="$${_s%"$${_s#?}"}"; _s="$${_s#?}"; case "$$_c" in [a-zA-Z0-9._~-]) _o="$$_o$$_c";; %) _o="$${_o}%25";; @) _o="$${_o}%40";; :) _o="$${_o}%3A";; /) _o="$${_o}%2F";; [?]) _o="$${_o}%3F";; [#]) _o="$${_o}%23";; " ") _o="$${_o}%20";; *) _o="$$_o$$_c";; esac; done; printf "%s" "$$_o"; };
        setup_src() { case "$$BACKUP_S3_ENDPOINT" in *://*) ;; *) return 1;; esac; _scheme="$${BACKUP_S3_ENDPOINT%%://*}"; _rest="$${BACKUP_S3_ENDPOINT#*://}"; MC_HOST_src="$${_scheme}://$$(enc "$$BACKUP_S3_ACCESS_KEY_ID"):$$(enc "$$BACKUP_S3_SECRET_ACCESS_KEY")@$${_rest}"; export MC_HOST_src; };
        setup_tgt() { case "$$BACKUP_TARGET_ENDPOINT" in *://*) ;; *) return 1;; esac; _scheme="$${BACKUP_TARGET_ENDPOINT%%://*}"; _rest="$${BACKUP_TARGET_ENDPOINT#*://}"; MC_HOST_tgt="$${_scheme}://$$(enc "$$BACKUP_TARGET_ACCESS_KEY_ID"):$$(enc "$$BACKUP_TARGET_SECRET_ACCESS_KEY")@$${_rest}"; export MC_HOST_tgt; };
        umask 077;
        HOME=/tmp;
        export HOME;
        # Same retention validation as the dump loop above (pass 58): a typo or
        # a negative value was read as 0 by the arithmetic, which keeps ONE
        # snapshot and deletes every other one. An invalid value skips rotation
        # (local and off-site), so the snapshot is still written and every
        # previous one kept.
        ROTATE=1;
        case "$$BACKUP_KEEP" in ""|*[!0-9]*) ROTATE=0; echo "[backup-objects] FAILED: BACKUP_KEEP must be a non-negative integer (got $$BACKUP_KEEP) — snapshot rotation is SKIPPED and every previous snapshot is kept" >&2;; esac;
        if [ ! -w /backups ]; then echo "[backup-objects] /backups is NOT writable by uid $$(id -u): the bind-mounted ./backups is missing or owned by another user, so no snapshot will ever be written. On the host: mkdir -p backups && chown $$(id -u):$$(id -g) backups" >&2; fi;
        mkdir -p /backups/objects;
        chmod 700 /backups/objects 2>/dev/null || true;
        rm -rf /backups/objects/.*.partial;
        STAMP=$$(date +%Y%m%d-%H%M%S);
        OK=0;
        if ! setup_src; then
          echo "[backup-objects] FAILED at $${STAMP} — cannot configure the source alias (BACKUP_S3_ENDPOINT needs a scheme, e.g. http://storage:9000)" >&2;
        elif mc mirror --overwrite --remove src/$${BACKUP_S3_BUCKET} /backups/objects/.$${STAMP}.partial && [ "$$(mc ls --recursive --quiet /backups/objects/.$${STAMP}.partial 2>/dev/null | wc -l | tr -d " ")" -gt 0 ]; then
          mv /backups/objects/.$${STAMP}.partial /backups/objects/$${STAMP};
          # Same clamp as the dump rotation above (pass 37): KEEP=0 must not
          # delete the snapshot this run just renamed into place. Only our
          # YYYYMMDD-HHMMSS snapshots are candidates; anything else in this
          # directory belongs to the operator (pass 55). An invalid KEEP skips
          # the rotation entirely (pass 58).
          if [ "$$ROTATE" = 1 ]; then ls -1t /backups/objects/ | while read -r f; do case "$$f" in [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]) echo "$$f";; esac; done | tail -n +$$((BACKUP_KEEP > 0 ? BACKUP_KEEP + 1 : 2)) | while read -r f; do rm -rf /backups/objects/$$f; done; fi;
          OK=1;
          if [ "$$ROTATE" = 1 ]; then echo "[backup-objects] $${STAMP} mirrored (keep $$((BACKUP_KEEP > 0 ? BACKUP_KEEP : 1)))"; else echo "[backup-objects] $${STAMP} mirrored; rotation skipped because BACKUP_KEEP is invalid (every previous snapshot is kept)"; fi;
        else
          rm -rf /backups/objects/.$${STAMP}.partial;
          # The count arm is what catches `mc mirror` exiting 0 on an EMPTY
          # source (a recreated bucket, a wrong endpoint): that snapshot would
          # rotate away the oldest complete one, and the off-site leg below
          # would wipe its target with --remove.
          echo "[backup-objects] FAILED at $${STAMP} — no snapshot written (empty or failed mirror), rotation skipped (the previous snapshots are untouched)" >&2;
        fi;
        if [ -n "$${BACKUP_TARGET_ENDPOINT}" ]; then
          if [ "$$OK" != 1 ]; then
            echo "[backup-objects] off-site mirror SKIPPED at $${STAMP}: no local snapshot was written this run (see the FAILED line above)" >&2;
          elif [ -z "$${BACKUP_TARGET_BUCKET}" ]; then
            # Without a bucket name `tgt//$STAMP` makes mc CREATE a bucket named
            # after the timestamp, and the rotation below then deletes
            # timestamp-named buckets on the remote store. The restore script
            # already refuses a bare/empty target; the backup side must too.
            echo "[backup-objects] off-site mirror FAILED at $${STAMP} (BACKUP_TARGET_BUCKET is empty; the local snapshot is complete)" >&2;
          elif ! setup_tgt; then
            echo "[backup-objects] off-site mirror FAILED at $${STAMP} (cannot configure the target alias; the local snapshot is complete)" >&2;
          else
            mc mb -p tgt/$${BACKUP_TARGET_BUCKET} >/dev/null 2>&1 || true;
            # The snapshot goes under its OWN stamp prefix, and the remote
            # prefixes are rotated like the local ones. Mirroring into the
            # bucket ROOT made the off-site copy equal the previous night of live state:
            # a partial deletion was copied off-site on the next run, while the
            # only history sat on the same host the copy exists to survive
            # (pass 54). Only our YYYYMMDD-HHMMSS prefixes are ever pruned.
            if mc mirror --overwrite --remove /backups/objects/$${STAMP} tgt/$${BACKUP_TARGET_BUCKET}/$${STAMP}; then
              if [ "$$ROTATE" = 1 ]; then mc ls tgt/$${BACKUP_TARGET_BUCKET} 2>/dev/null | tr -s " " "\n" | while read -r f; do case "$$f" in [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]/) echo "$${f%/}";; esac; done | sort -r | tail -n +$$((BACKUP_KEEP > 0 ? BACKUP_KEEP + 1 : 2)) | while read -r old; do mc rm --recursive --force tgt/$${BACKUP_TARGET_BUCKET}/$$old || echo "[backup-objects] could not prune off-site snapshot $$old" >&2; done; fi;
              echo "[backup-objects] off-site mirror done";
            else
              echo "[backup-objects] off-site mirror FAILED at $${STAMP} (the local snapshot is complete)" >&2;
            fi;
          fi;
        fi;
        sleep 86400;
      done'

volumes:
  pgdata:
  miniodata:
  redisdata:
