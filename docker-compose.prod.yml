# Production deployment: HTTPS (Caddy) + managed services (Postgres/Redis/S3).
# Build the images with the DEFAULT file first — that is where the build: blocks
# (and the NEXTAUTH_URL / NEXT_PUBLIC_SENTRY_DSN build args) live:
#   NEXTAUTH_URL="https://your-domain" docker compose build migrate web worker rollover
# This file only NAMES the resulting images (migrate has no build: of its own — it
# reuses the worker image). Asking THIS file to build silently builds nothing:
# compose skips a service with no build: block, exits 0 and prints nothing, so the
# upgrade ran against the previous images and looked like a success.
# then: docker compose -f docker-compose.prod.yml up -d
name: pixelduo-prod

x-appenv: &appenv
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
  NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL, e.g. https://pixelduo.ai}
  SMTP_URL: ${SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  # Must be set: without it production refuses to send feedback notifications
  # (see feedbackMailRefusal in lib/mail.ts) rather than mailing users' messages
  # to the address hardcoded there. The compose anchor is the only path by which
  # this variable reaches the containers.
  FEEDBACK_TO: ${FEEDBACK_TO:-}
  FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
  FEEDBACK_WEBHOOK_KIND: ${FEEDBACK_WEBHOOK_KIND:-feishu}
  EMAIL_VERIFY_AUTO: "0"
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?set PAYMENT_PROVIDER (stripe or paddle — mock is forbidden in production)}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PADDLE_API_KEY: ${PADDLE_API_KEY:-}
  PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
  PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
  PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
  PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT (public URL, e.g. R2/S3)}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  # Forwarded, not pinned (pass 34). .env.example documents this knob as
  # true-for-MinIO / false-for-R2-AWS, and lib/storage.ts reads it - but this
  # anchor hardcoded "false", so the one setting a path-style-only endpoint
  # needs could not be set at all: every storage call built
  # https://<bucket>.<endpoint>/..., /api/health reported storage down, and
  # generation failed closed with no knob to fix it. Same shape as the
  # IMAGE_MODERATION discard pass 32 fixed in single.yml. Default false, the
  # R2/AWS-safe value, so an unset variable behaves exactly as before.
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: production
  IMAGE_MODERATION: ${IMAGE_MODERATION:-1}
  VISION_MODERATION_MODEL: ${VISION_MODERATION_MODEL:-gpt-5.6-luna}
  # Set BOTH or NEITHER — the pair is atomic (see getVisionConfig): setting only
  # one is treated as "no vision config", and since IMAGE_MODERATION defaults to
  # on, the worker then refuses to boot rather than delivering unaudited output.
  VISION_MODERATION_BASE_URL: ${VISION_MODERATION_BASE_URL:-}
  VISION_MODERATION_API_KEY: ${VISION_MODERATION_API_KEY:-}
  MODELVERSE_IMAGE_API_KEY: ${MODELVERSE_IMAGE_API_KEY:-}
  ARK_IMAGE_API_KEY: ${ARK_IMAGE_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  # The endpoint half of the assistant's credential pair — resolved ATOMICALLY
  # with the key (lib/keys.ts), so forwarding only the key (which is what this
  # anchor used to do) leaves it ignored in the container: the prompt assistant
  # and smart routing silently take their offline fallbacks while the key sits
  # there looking configured. Set both, or neither; the app warns at boot when
  # only one is present.
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  # Documented knobs no anchor named, so they could not reach a container. The
  # external moderation detector is the one that matters: it is documented as
  # taking precedence over the vision path when set, so setting it alongside
  # IMAGE_MODERATION=0 left output unaudited while the product promises a safety
  # review on every image.
  IMAGE_NSFW_ENDPOINT: ${IMAGE_NSFW_ENDPOINT:-}
  WATERMARK_TEXT: ${WATERMARK_TEXT:-}
  CHECKIN_TIMEZONE: ${CHECKIN_TIMEZONE:-}
  FEEDBACK_NOTIFY_LIMIT: ${FEEDBACK_NOTIFY_LIMIT:-}
  AUTH_MAIL_HOURLY_LIMIT: ${AUTH_MAIL_HOURLY_LIMIT:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
  TRUST_X_REAL_IP: ${TRUST_X_REAL_IP:-0}
  # Social sign-in. lib/auth.ts registers the Google/GitHub providers only when
  # all four are present, and NO anchor named any of them — so social login was
  # impossible in every container deployment while README.md, docs/release.md
  # and docs/compliance/launch-checklist.md all described it as "configure the
  # env and it turns on". Fail-closed (no buttons appear), but a silently
  # missing feature the docs claimed was shipped.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  # The documented remedy for a deployment without SMTP_URL (the boot assertion
  # names it: "set MAIL_DEV_MODE=1 to accept that"). Only the local compose
  # forwarded it, so in production the operator was told to do something the
  # deployment could not express. 0 here: accepting a log-only mailer is a
  # deliberate act, never a default.
  MAIL_DEV_MODE: ${MAIL_DEV_MODE:-0}
  # Edge limits and per-route ceilings the code reads. All fail closed (their
  # defaults apply) but none could be TIGHTENED in a container, which is the
  # direction an operator needs after an incident.
  MIDDLEWARE_AUTH_LIMIT: ${MIDDLEWARE_AUTH_LIMIT:-}
  MIDDLEWARE_API_LIMIT: ${MIDDLEWARE_API_LIMIT:-}
  MIDDLEWARE_PAGE_LIMIT: ${MIDDLEWARE_PAGE_LIMIT:-}
  REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-}
  OAUTH_CALLBACK_RATE_LIMIT: ${OAUTH_CALLBACK_RATE_LIMIT:-}
  OUTBOUND_TIMEOUT_MS: ${OUTBOUND_TIMEOUT_MS:-}
  # Image-generation keys for the DashScope (Aliyun) family. Its models are
  # disabled, but the key is still what lib/keys.ts resolves for that gateway.
  ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
  # Same credential under the vendor's own name: getAliyunKey() takes either
  # (lib/keys.ts) and .env.example documents this spelling, but no anchor named
  # it, so it was silently discarded in every container deployment.
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  # Read by sentry.server.config.ts, sentry.edge.config.ts and
  # lib/observability.ts to tag events with the build they came from. Only the
  # local compose named it, so no production deployment could set one and every
  # event arrived with no release — the "which deploy introduced this" question
  # was unanswerable. NOT instrumentation-client.ts, which this paragraph used
  # to claim: the browser bundle only carries NEXT_PUBLIC_* names (pass 30 read
  # the built chunk — the client release is undefined by construction).
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  HOSTNAME: 0.0.0.0

services:
  # Schema migrations, ahead of anything that touches the tables. The other two
  # compose files have this service; this one did not, while docs/deploy.md and
  # docs/release.md both told the operator that migrations run as part of the
  # deploy. So the documented flow — `docker compose -f docker-compose.prod.yml
  # up -d` against a fresh managed Postgres — brought up a stack with NO schema,
  # and it reported healthy: /api/health probes the connection with `SELECT 1`,
  # which needs no tables, so the container healthcheck and Caddy both passed
  # while every application route answered `relation "User" does not exist`.
  migrate:
    image: ${IMAGE_WORKER:-image-gen-worker:latest}
    command: npx prisma migrate deploy
    environment: *appenv
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Required, like every other production variable here. The default was
      # "localhost", which does not fail closed: an operator who forgot to set
      # it got a deployment that came up healthy on a self-signed localhost
      # certificate while serving the real domain over plain HTTP — the exact
      # silent-wrong-control shape the rest of this file refuses with `:?`.
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN, e.g. pixelduo.ai}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    image: ${IMAGE_WEB:-image-gen-web:latest}
    environment: *appenv
    expose:
      - "3000"
    # The schema has to exist before the first request. Without this the app
    # started anyway and answered 500 on every route — see the migrate service.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: ${IMAGE_WORKER:-image-gen-worker:latest}
    environment:
      <<: *appenv
      MOCK_IMAGE_PROVIDER: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  rollover:
    image: ${IMAGE_WORKER:-image-gen-worker:latest}
    # Every pass is chained with && and a failure ends the container (instead of
    # `;`, which discarded each exit status and looped forever): a persistent
    # failure here — database down, a broken deploy, OOM — used to stop plan
    # downgrade, credit expiry and the expiry reminders SILENTLY, since the loop
    # never exited and no healthcheck watches this service. Now the failure is a
    # restart loop the operator can see, and `restart: unless-stopped` retries it.
    command: sh -c "while true; do npx tsx scripts/rollover.ts && npx tsx scripts/expire.ts && npx tsx scripts/remind.ts || { echo '[rollover] a maintenance pass failed — exiting for a retry'; exit 1; }; sleep 86400; done"
    environment: *appenv
    # The other two compose files give this service the same condition; this one
    # did not, so on a fresh managed database `rollover` raced `migrate` and ran
    # its passes against a schema that did not exist yet — a restart loop on
    # first deploy (self-healing, since `restart: unless-stopped` retries, but
    # log noise and no maintenance until migrate finished).
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
